    <style>
      .loader-wrapper-unq {
        width: 100%;
        height: 100%;
        position: fixed;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .loader-unq {
        border: 16px solid #f3f3f3;
        border-top: 16px solid #673ab7;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin-unq 2s linear infinite;
      }

      /* Screen reader only content */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @keyframes spin-unq {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
