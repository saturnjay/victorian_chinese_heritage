

<!DOCTYPE html>

<html lang="en-au" xmlns="http://www.w3.org/1999/xhtml">

  <head><title>
	Yackandandah Cemetery - Burial Search
</title>

    <script src="Scripts/jquery-3.7.0.min.js"></script>
    <script src="Scripts/cemetery.js"></script>
    <script src="Scripts/Slideshow.js" type="text/javascript"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" /><link rel="stylesheet" href="Styles/Cemetery.css" />

    <style>

      .container {
        background-color: #f2f2f2;
        border-bottom-left-radius: 5px;
        border-bottom-right-radius: 5px;
        border-top-left-radius: 5px;
        border-top-right-radius: 5px;
        box-sizing: border-box;
        color: black;
        display: block;
        line-height: 22.5px;
        padding: 10px 10px 10px 10px;
        text-size-adjust: 100%;
      }

      body {
        font-family: Verdana, sans-serif;
        font-size: 15px;
      }

      input[type=text], textarea, select {
        -webkit-transition: all 0.30s ease-in-out;
        -moz-transition: all 0.30s ease-in-out;
        -ms-transition: all 0.30s ease-in-out;
        -o-transition: all 0.30s ease-in-out;
        outline: none;
        border: 1px solid #DDDDDD;
      }
 
      input[type=text]:focus, textarea:focus, select:focus {
        box-shadow: 0 0 5px rgba(81, 203, 238, 1);
        border: 1px solid rgba(81, 203, 238, 1);
      }

      table {
        width: 100%;
        background-color: #fff;
        margin: 5px 0 10px 0;
        border-collapse:collapse;
      }

      th {
        border-bottom: 1px solid #ddd;
        text-align:left;
      }

      td {
        border-bottom: none;
      }

      tr:nth-child(even) {background-color: #f2f2f2;}
      tr:hover, tr:nth-child(even):hover {color: #4caf50;}

      .bad {
        box-shadow: 0 0 5px rgba(255, 0, 0, 1);
        border: 1px solid rgba(255, 0, 0, 1);
      }

    </style>

  </head>

  <body>

    <form method="post" action="./Search.aspx" id="frmSearch">
<input type="hidden" name="__VIEWSTATE" id="__VIEWSTATE" value="2CoeasMjC8aAyiP7e/lnRTEdiEVIk2D2khFGwgsLz4TS0l324XL1L6n6+npMCqsgd/SPFEe/a8aOgnyBSBq1i5DbkjUlFpLgjWZNslEzETs=" />

<input type="hidden" name="__VIEWSTATEGENERATOR" id="__VIEWSTATEGENERATOR" value="BBBC20B8" />

      <div class="container">

        <div style="display:flex;">
          <div style="flex-grow:4;">
            Surname<br />
            <input type="text" id="txtSearchSurname" style="-webkit-box-sizing:border-box; -moz-box-sizing:border-box; box-sizing:border-box; width:100%;" />
          </div>
          <div style="flex-grow:4; padding-left:40px;">
            Given&nbsp;names<br />
            <input type="text" id="txtSearchGivenNames" style="-webkit-box-sizing:border-box; -moz-box-sizing:border-box; box-sizing:border-box; width:100%;" />
          </div>
          <div style="flex-grow:0; padding-left:40px;">
            Year&nbsp;of&nbsp;death<br />
            <input type="text" id="txtSearchBurialYear" maxlength="4" size="10" />
          </div>
        </div>

        <br />

        <div style="display:flex;">
          <div style="flex-grow:1;">
            Section:<br />
            <div style="display:inline-flex; width:100%;">
              <input type="text" id="txtSearchSections" onclick="selectSections()" readonly="true" style="cursor:pointer; -webkit-box-sizing:border-box; -moz-box-sizing:border-box; box-sizing:border-box; width:100%;" title="Click to select the sections to search:" value="All Sections" />
              &nbsp;
              <img src="Images/Filter.gif" onclick="selectSections()" style="cursor:pointer;" title="Select the cemetery sections to search" />
            </div>
          </div>
        </div>

        <br />

        <div style="display:flex;">
          <button id="btnSearch" class="button" onclick="return search();" title="Run this burial record search now">Search</button>
          
          
        </div>

      </div>

      <br />

      <div id="divBurialsFound" class="container" style="display:none;">

        <div>
          <span id="spanSearchResultsHeader" style="color:#4caf50; font-size:20px; font-weight:bold;">Search Results</span>
          <span id="spanSearchResultsCount" style="color:#4caf50;">0 records found.</span>
        </div>

        <table id="tblBurialsFound" style="display:none;">
          <thead>
            <tr>
              <th>Surname</th>
              <th>Given Names</th>
              <th>Year of Death</th>
              <th>Section</th>
              <th>Details</th>
            </tr>
          </thead>
        </table>

      </div>

    </form>

    <div id="dlgSections" class="modal">
      <div class="modal-header">Select section(s) to search</div>
      <div id="divSections" class="modal-content"></div>
      <div class="modal-content">
        <button class="button" onclick='$("#dlgSections").hide(); selectSectionsSelected();'>Save</button>
        <button class="button" onclick='$("#dlgSections").hide();'>Cancel</button>
      </div>
    </div>
    
    <script>

      var bDeleteAllowed = false;
      var bModifyAllowed = false;
      var nMaxRecords = 50;
      var nUserID = 0;

      function editDetails(cellView) {
        __doPostBack("btnEdit", cellView.children[0].value);
        return false;
      };

      function loadSections() {
        $.post(sessionAPIpath(window.location), JSON.stringify({requestType: "GetSections"}), loadSectionsFetched).fail(apiCallFailed);
      };

      function loadSectionsFetched(data) {
        if (data.result) {

          // Clear existing sections
          $("#divSections").empty();

          // Add check box for all sections
          var chkAllSections = document.createElement("input");
          chkAllSections.id = "chkAllSections";
          chkAllSections.setAttribute("type", "checkbox");
          chkAllSections.checked = ($("#txtSearchSections").val() === "All Sections");
          chkAllSections.onclick = function () { selectSection(chkAllSections); };

          var lblAllSections = document.createElement('label');
          lblAllSections.htmlFor = "chkAllSections";
          lblAllSections.appendChild(document.createTextNode("All Sections"));

          $("#divSections").append(chkAllSections);
          $("#divSections").append(lblAllSections);
          $("#divSections").append("<br />");

          // Step through rows returned, adding to table
          for (var x = 0; x < data.count; x++) {

            // Add check box
            var chkSection = document.createElement("input");
            chkSection.id = "chkSection" + data.sections[x].sectionID.toString();
            chkSection.setAttribute("type", "checkbox");
            chkSection.checked = $("#txtSearchSections").val().split(", ").includes(data.sections[x].sectionName) || ($("#txtSearchSections").val() === "All Sections");
            chkSection.onclick = function () { selectSection(chkSection); };

            var lblSection = document.createElement('label');
            lblSection.htmlFor = "chkSection" + data.sections[x].sectionID.toString();
            lblSection.appendChild(document.createTextNode(data.sections[x].sectionName));

            $("#divSections").append(chkSection);
            $("#divSections").append(lblSection);
            $("#divSections").append("<br />");

          }

        }
      };

      function search() {

        $("#btnSearch").html('<i class="fa fa-refresh fa-spin"></i> Searching');

        // Hide previous search
        $("#divBurialsFound").hide();
        $("#tblBurialsFound").hide();

        // Search
        $.post(sessionAPIpath(window.location), JSON.stringify({
          requestType: "GetBurials",
          surnameSearch: $("#txtSearchSurname").val(),
          givenNamesSearch: $("#txtSearchGivenNames").val(),
          burialYear: $("#txtSearchBurialYear").val(),
          sectionList: $("#txtSearchSections").val(),
          maxRecords: nMaxRecords
        }), searchDone).fail(apiCallFailed);

        return false;

      };

      function searchDone(data) {

        $("#btnSearch").html('Search');

        if (data.result) {

          // Display headers
          $("#divBurialsFound").show();
          $("#spanSearchResultsCount").text(data.count.toString() + " burial" + ((data.count !== 1) ? "s" : "") + " found" + ((data.count >= nMaxRecords) ? " (maximum of " + nMaxRecords.toString() + " displayed)" : "") + ".");

          // Point to table
          var table = $("#tblBurialsFound")[0];

          // Clear rows from previous search
          for (var x = table.rows.length - 1; x > 0; x--) table.deleteRow(x);

          // Add burials found
          for (var x = 0; x < data.count; x++) {

            // Add row and cells
            var rowNew = table.insertRow(-1);
            var cellSurname = rowNew.insertCell(0);
            var cellGivenNames = rowNew.insertCell(1);
            var cellBurialYear = rowNew.insertCell(2);
            var cellSection = rowNew.insertCell(3);
            var cellView = rowNew.insertCell(4);

            // Add content
            cellSurname.innerText = data.burials[x].surname;
            cellGivenNames.innerText = data.burials[x].givenNames;
            cellBurialYear.innerText = data.burials[x].burialYear.toString();
            cellSection.innerText = data.burials[x].sectionName;

            // Add ID
            var hdnID = document.createElement("input");
            hdnID.type = "hidden";
            hdnID.value = data.burials[x].id;
            cellView.appendChild(hdnID);

            // Add 'view details'
            var imgView = document.createElement("img");
            imgView.onclick = function () { return viewDetails(this.parentElement); };
            imgView.src = "Images/SearchSmall.gif";
            imgView.style.cursor = "pointer";
            imgView.title = "View all details for " + data.burials[x].givenNames + ' ' + data.burials[x].surname;
            cellView.appendChild(imgView);

            // Add 'edit details'
            if ((nUserID > 0) && bModifyAllowed) {
              var imgEdit = document.createElement("img");
              imgEdit.onclick = function () { return editDetails(this.parentElement); };
              imgEdit.src = "Images/Comment.gif";
              imgEdit.style.cursor = "pointer";
              imgEdit.style.marginLeft = "8px";
              imgEdit.title = "Edit details of " + data.burials[x].givenNames + ' ' + data.burials[x].surname;
              cellView.appendChild(imgEdit);
            }

          }

          // Show list
          $("#tblBurialsFound").show();

        }

        else displayAlert("Error", data.message);

      };

      function selectAllSelected() {
        var bAllSelected = true;
        $("#divSections input").each(function () { if (($(this)[0].nextSibling.innerText !== "All Sections") && (!$(this)[0].checked)) bAllSelected = false; });
        return bAllSelected;
      }

      function selectSection(chkSection) {
        if (chkSection.nextSibling.innerText === "All Sections") {
          $("#divSections input").each(function () { if ($(this)[0].nextSibling.innerText !== "All Sections") $(this)[0].checked = chkSection.checked; });
        }
        else $("#chkAllSections")[0].checked = selectAllSelected();
      };

      function selectSections() {
        $("#dlgSections").show();
        return false;
      };

      function selectSectionsSelected() {
        if (selectAllSelected()) $("#txtSearchSections").val("All Sections");
        else {
          var sSections = "";
          $("#divSections input:checked").each(function () { if ($(this)[0].nextSibling.innerText !== "All Sections") sSections = sSections + ((sSections === "") ? "" : ", ") + $(this)[0].nextSibling.innerText; });
          $("#txtSearchSections").val(sSections);
        }
      };

      function viewDetails(cellView) {

        // Get all details
        $.post(sessionAPIpath(window.location), JSON.stringify({
          requestType: "GetBurial",
          id: cellView.children[0].value
        }), viewDetailsFetched).fail(apiCallFailed);

      };

      function viewDetailsFetched(data) {
        if (data.result) displayAlert(data.title, data.details);
      };

      $(document).ready(function () {
        loadSections();
      });

    </script>

  </body>

</html>
